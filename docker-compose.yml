services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veridex
      POSTGRES_PASSWORD: veridex
      POSTGRES_DB: veridex
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridex"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      VERIDEX_DATABASE_URL: postgresql+psycopg://veridex:veridex@postgres:5432/veridex
      VERIDEX_STORAGE_ROOT: /data
      VERIDEX_CORS_ORIGINS: http://localhost:3000
      VERIDEX_ALLOW_UNREVIEWED_MODEL: "1"
      VERIDEX_DETECTOR: yolo
      VERIDEX_OCR: unavailable
    volumes:
      - storage:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: python -m veridex.worker
    environment:
      VERIDEX_DATABASE_URL: postgresql+psycopg://veridex:veridex@postgres:5432/veridex
      VERIDEX_STORAGE_ROOT: /data
      VERIDEX_ALLOW_UNREVIEWED_MODEL: "1"
      VERIDEX_DETECTOR: yolo
      VERIDEX_OCR: unavailable
    volumes:
      - storage:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
