[project]
name = "veridex"
version = "0.1.0"
description = "AI-powered evidence investigation for e-commerce package disputes"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
ml = [
  "opencv-python-headless>=4.10.0",
  "ultralytics>=8.3.0",
  "paddleocr>=2.9.0",
  "paddlepaddle>=2.6.0",
]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["veridex*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
